<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf7ff"><title>桐榮祭2026 打ち上げ管理</title>
<style>
:root{--blue:#8bd2f4;--blue-deep:#287da5;--pale:#eef9ff;--ink:#244054;--muted:#718797;--line:#dcebf3;--red:#b74350;--green:#237c61;--surface:#fff;--soft:#f5fbff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8fcff 0%,#edf8ff 52%,#e7f4ff 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.5}button,input,select,textarea{font:inherit}button{border:1px solid transparent;border-radius:12px;padding:11px 16px;background:var(--blue);color:#173f55;font-weight:700;cursor:pointer;transition:background .18s,transform .18s,border-color .18s}button:hover{background:#75c6ee}button:active{transform:translateY(1px)}button.secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}button.secondary:hover{background:var(--pale)}button.danger{background:#fff1f2;border-color:#f5d9dc;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #d1e3ed;border-radius:11px;padding:11px 12px;background:var(--surface);color:var(--ink);outline:none;transition:border-color .18s,box-shadow .18s}input:focus,select:focus,textarea:focus{border-color:#79c7ed;box-shadow:0 0 0 3px #8bd2f426}label{display:block;font-size:.88rem;font-weight:700;margin:13px 0 6px}.wrap{max-width:1120px;margin:auto;padding:24px 16px 56px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#dff5ff,#c9ecff);font-size:25px;box-shadow:inset 0 0 0 1px #c7e9f8}.brand h1{font-size:1.28rem;letter-spacing:.01em;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:.88rem}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 16px;box-shadow:0 8px 24px #2e73900c}.card h2{font-size:1.15rem;margin:0 0 8px}.card h3{font-size:1rem;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.small{font-size:.86rem;color:var(--muted);line-height:1.65}.notice{background:var(--pale);border:1px solid var(--line);padding:12px 14px;border-radius:12px;font-size:.9rem;line-height:1.6}.error{color:var(--red)}.success{color:var(--green)}.hidden{display:none!important}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tabs button{background:#fff;border-color:var(--line);color:var(--muted);padding:9px 13px}.tabs button.active{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}.stat{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:14px}.stat span{display:block;font-size:.83rem;color:var(--muted);margin-bottom:3px}.stat strong{font-size:1.4rem;letter-spacing:-.02em}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-size:.84rem;color:#526f82}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfdff}.badge{display:inline-block;background:var(--pale);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.8rem;font-weight:700}.section{margin-top:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#244054;color:#fff;padding:12px 17px;border-radius:12px;display:none;z-index:10;max-width:90vw;box-shadow:0 8px 24px #24405430}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}.card{padding:16px;border-radius:16px}.wrap{padding:16px 10px 36px}.brand h1{font-size:1.08rem}.row button{min-width:0}}
</style>
</head>
<body><main class="wrap">
<header class="brand"><div class="logo">🎉</div><div><h1>桐榮祭2026 打ち上げ管理</h1><p>出欠・買い物・予算・会計をひとつに</p></div></header>
<section class="card"><h2>ログイン</h2><p class="small">メールアドレスに届くログイン用リンクから利用できます。パスワードは不要です。初めての方も同じ手順で登録できます。</p>
<label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="メールアドレス">
<div class="section"><button id="login">ログインリンクを送信</button></div><p id="authMsg" class="small"></p></section>
<section id="userPanel" class="card hidden"><div class="row"><div><h2>出欠登録</h2><p id="who" class="small"></p></div><button class="secondary" id="logout">ログアウト</button></div>
<div id="unverified" class="notice hidden">メール確認が必要です。確認メールを開いたあと、再ログインしてください。</div>
<div id="attendanceForm" class="hidden"><p class="small">名簿に事前登録されたアカウントのみ出欠登録できます。氏名は姓と名を分け、間は全角スペース1文字で保存します。</p>
<div class="grid"><div><label for="surname">姓</label><input id="surname" maxlength="40"></div><div><label for="given">名</label><input id="given" maxlength="40"></div></div>
<label for="status">出欠</label><select id="status"><option>出席</option><option>欠席</option><option>考え中</option></select><div class="section"><button id="saveAttendance">出欠を登録・更新</button> <button class="secondary" id="request">名簿登録を申請</button></div><p id="userMsg" class="small"></p></div></section>
<section id="adminPanel" class="hidden"><section class="card"><div class="row"><div><h2>管理者ダッシュボード</h2><p class="small">サーバー側で付与された権限を確認済みです。</p></div><span class="badge">管理者</span></div><div class="grid3" id="stats"></div></section>
<nav class="tabs" id="tabs"><button class="active" data-tab="attendance">出欠</button><button data-tab="members">名簿</button><button data-tab="requests">申請</button><button data-tab="shopping">買い物</button><button data-tab="budget">予算・会計</button><button data-tab="tasks">タスク</button></nav><section class="card" id="panel">読み込み中…</section></section>

</main><div id="toast" class="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"YOUR_FIREBASE_API_KEY",authDomain:"toueusai-utiage2026.firebaseapp.com",databaseURL:"https://toueusai-utiage2026-default-rtdb.firebaseio.com/",projectId:"toueusai-utiage2026",appId:"YOUR_FIREBASE_APP_ID"};
const MAIN_ADMIN_EMAIL="dkrg26nu@uni.mejiro.ac.jp";
const configured=firebaseConfig.apiKey!=="YOUR_FIREBASE_API_KEY"&&firebaseConfig.appId!=="YOUR_FIREBASE_APP_ID";
let auth=null,db=null,user=null,role="none",tab="attendance";
const $=id=>document.getElementById(id), hide=(id,v=true)=>$(id).classList.toggle("hidden",!v), say=(id,s,cls="small")=>{$(id).textContent=s;$(id).className=cls;};
const toast=s=>{const e=$("toast");e.textContent=s;e.style.display="block";setTimeout(()=>e.style.display="none",3000)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanPart=s=>s.trim()&&!/[\s\u3000\u0000-\u001f\u007f]/.test(s.trim());
const nameOf=(a,b)=>a.trim()+"　"+b.trim();
const entries=o=>Object.entries(o||{});
const friendly=e=>({"auth/invalid-credential":"メールアドレスを確認して、ログインリンクを再送してください。","auth/invalid-email":"メールアドレスの形式を確認してください。","auth/too-many-requests":"試行回数が多すぎます。時間をおいてください。","auth/expired-action-code":"リンクの有効期限が切れています。もう一度リンクを送信してください。","auth/invalid-action-code":"リンクが無効か、すでに使用されています。もう一度リンクを送信してください。","auth/unauthorized-continue-uri":"Firebase Consoleでこのサイトのドメインを許可してください。","PERMISSION_DENIED":"アクセス権限がありません。Security Rulesを確認してください。"}[e?.code]||"処理に失敗しました。設定・入力・権限を確認してください。");
if(configured){try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.database()}catch(e){console.error(e)}}
function needFirebase(){if(!auth||!db){say("authMsg","Firebase設定が未完了です。apiKeyとappIdをFirebase Consoleの実値に置き換えてください。","error");return false}return true}
const EMAIL_LINK_KEY="toueusai2026_signin_email";
const actionCodeSettings={url:location.origin+location.pathname,handleCodeInApp:true};
$("login").onclick=async()=>{if(!needFirebase())return;const email=$("email").value.trim();if(!email)return say("authMsg","メールアドレスを入力してください。","error");try{await auth.sendSignInLinkToEmail(email,actionCodeSettings);localStorage.setItem(EMAIL_LINK_KEY,email);say("authMsg","ログイン用リンクを送信しました。メールを開き、同じ端末・ブラウザでリンクを押してください。","success")}catch(e){say("authMsg",friendly(e),"error")}};
if(auth&&auth.isSignInWithEmailLink(window.location.href)){(async()=>{let email=localStorage.getItem(EMAIL_LINK_KEY);if(!email)email=window.prompt("ログインリンクを送信したメールアドレスを入力してください。");if(!email)return say("authMsg","メールアドレスが確認できないため、ログインを中止しました。","error");try{await auth.signInWithEmailLink(email.trim(),window.location.href);localStorage.removeItem(EMAIL_LINK_KEY);history.replaceState({},document.title,location.pathname+location.hash);say("authMsg","ログインしました。","success")}catch(e){say("authMsg",friendly(e),"error")}})()}
$("logout").onclick=()=>auth?.signOut();
async function getRole(u){try{const t=await u.getIdTokenResult(true);if(t.claims.admin===true)return t.claims.mainAdmin===true?"mainAdmin":"admin"}catch(e){}return "user"}
if(auth)auth.onAuthStateChanged(async u=>{user=u;hide("userPanel",!!u);hide("adminPanel",false);hide("authMsg",false);if(!u)return;$("who").textContent="ログイン中："+(u.email||"");hide("userPanel",true);hide("unverified",!u.emailVerified);hide("attendanceForm",u.emailVerified);if(!u.emailVerified)return;role=await getRole(u);if(role==="admin"||role==="mainAdmin"){hide("adminPanel",true);await renderAdmin()}else{try{const s=await db.ref("members/"+u.uid).get();if(s.exists()){$("surname").value=s.val().surname||"";$("given").value=s.val().given||"";const a=await db.ref("attendance/"+u.uid).get();if(a.exists())$("status").value=a.val().status||"考え中";say("userMsg","名簿を確認しました。出欠を登録できます。")}else{say("userMsg","名簿に未登録です。登録申請を送信してください。")}}catch(e){say("userMsg",friendly(e),"error")}}});
$("saveAttendance").onclick=async()=>{if(!user||!user.emailVerified)return say("userMsg","メール確認が必要です。","error");const a=$("surname").value,b=$("given").value;if(!cleanPart(a)||!cleanPart(b))return say("userMsg","姓・名を入力してください。空白は含めないでください。","error");try{const m=await db.ref("members/"+user.uid).get();if(!m.exists())throw {code:"MEMBER_NOT_FOUND"};const val={name:nameOf(a,b),status:$("status").value,email:user.email,updatedAt:new Date().toISOString()};await db.ref("attendance/"+user.uid).set(val);say("userMsg","出欠を保存しました。","success")}catch(e){say("userMsg",e.code==="MEMBER_NOT_FOUND"?"名簿に登録されていません。先に登録申請をしてください。":friendly(e),"error")}};
$("request").onclick=async()=>{if(!user||!user.emailVerified)return say("userMsg","メール確認が必要です。","error");const a=$("surname").value,b=$("given").value;if(!cleanPart(a)||!cleanPart(b))return say("userMsg","姓・名を入力してください。","error");try{await db.ref("registration_requests/"+user.uid).set({uid:user.uid,name:nameOf(a,b),surname:a.trim(),given:b.trim(),email:user.email,status:"審査待ち",createdAt:new Date().toISOString()});say("userMsg","登録申請を送信しました。","success")}catch(e){say("userMsg",friendly(e),"error")}};
$("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;[...$("tabs").querySelectorAll("button")].forEach(x=>x.classList.toggle("active",x===b));renderAdmin()};
async function read(p){return (await db.ref(p).get()).val()}
async function write(p,v){if(!["admin","mainAdmin"].includes(role))throw new Error("権限がありません");await db.ref(p).set(v)}
function form(fields,button,id){return '<form id="'+id+'"><div class="grid">'+fields.map(f=>'<div><label>'+esc(f.label)+'</label><input name="'+esc(f.name)+'" '+(f.type?'type="'+esc(f.type)+'"':'')+(f.required?' required':'')+(f.step?' step="'+f.step+'"':'')+(f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'></div>').join("")+'</div><p class="section"><button>'+button+'</button></p></form>'}
async function renderAdmin(){if(!db||!["admin","mainAdmin"].includes(role))return;const p=$("panel");p.textContent="読み込み中…";try{const [members,ats,requests,items,budgets,ledger,tasks]=await Promise.all(["members","attendance","registration_requests","shopping_items","budgets","ledger","tasks"].map(read));const m=entries(members),a=entries(ats),r=entries(requests),s=entries(items),b=entries(budgets),l=entries(ledger),t=entries(tasks);$("stats").innerHTML=[["登録メンバー",m.length+"人"],["出席",a.filter(x=>x[1].status==="出席").length+"人"],["実支出","¥"+l.reduce((n,x)=>n+(Number(x[1].amount)||0),0).toLocaleString("ja-JP")]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join("");
if(tab==="attendance")p.innerHTML='<h2>出欠一覧</h2><div class="tablewrap"><table><thead><tr><th>氏名</th><th>出欠</th><th>更新</th></tr></thead><tbody>'+a.map(([id,v])=>'<tr><td>'+esc(v.name)+'</td><td>'+esc(v.status)+'</td><td>'+esc(v.updatedAt)+'</td></tr>').join("")+'</tbody></table></div>';
else if(tab==="members"){p.innerHTML='<h2>メンバー名簿</h2><p class="small">UIDは、本人が初回ログイン後に管理者が確認して登録します。メールアドレスだけで他人のUIDを推測しないでください。</p>'+form([{name:"uid",label:"Firebase UID",required:true},{name:"surname",label:"姓",required:true},{name:"given",label:"名",required:true},{name:"email",label:"メールアドレス",type:"email",required:true}],"登録","mf")+'<div class="tablewrap section"><table><thead><tr><th>氏名</th><th>メール</th><th>UID</th></tr></thead><tbody>'+m.map(([id,v])=>'<tr><td>'+esc(v.name)+'</td><td>'+esc(v.email)+'</td><td>'+esc(id)+'</td></tr>').join("")+'</tbody></table></div>'; $("mf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),uid=String(f.get("uid")).trim(),sn=String(f.get("surname")).trim(),gn=String(f.get("given")).trim(),em=String(f.get("email")).trim().toLowerCase();if(!uid||!cleanPart(sn)||!cleanPart(gn)||!em.includes("@"))return toast("入力を確認してください");try{await write("members/"+uid,{surname:sn,given:gn,name:nameOf(sn,gn),email:em,active:true,createdAt:new Date().toISOString()});toast("名簿に登録しました");renderAdmin()}catch(x){toast(friendly(x))}}}
else if(tab==="requests"){p.innerHTML='<h2>登録申請</h2><div class="tablewrap"><table><thead><tr><th>氏名</th><th>メール</th><th>状態</th><th>操作</th></tr></thead><tbody>'+r.map(([id,v])=>'<tr><td>'+esc(v.name)+'</td><td>'+esc(v.email)+'</td><td>'+esc(v.status)+'</td><td><button data-approve="'+esc(id)+'">承認・名簿登録</button> <button class="danger" data-reject="'+esc(id)+'">却下</button></td></tr>').join("")+'</tbody></table></div>';p.querySelectorAll("[data-approve]").forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.approve,v=requests[id];if(!v||!confirm(v.name+" さんを名簿に登録しますか？"))return;try{await write("members/"+id,{surname:v.surname,given:v.given,name:v.name,email:v.email,active:true,createdAt:new Date().toISOString()});await write("registration_requests/"+id+"/status","承認");toast("承認しました");renderAdmin()}catch(x){toast(friendly(x))}});p.querySelectorAll("[data-reject]").forEach(btn=>btn.onclick=async()=>{try{await write("registration_requests/"+btn.dataset.reject+"/status","却下");renderAdmin()}catch(x){toast(friendly(x))}})}
else if(tab==="shopping"){p.innerHTML='<h2>買い物リスト</h2>'+form([{name:"name",label:"商品名",required:true},{name:"url",label:"商品URL（https）",type:"url",required:true},{name:"category",label:"カテゴリ",required:true},{name:"plannedUnitPrice",label:"予定単価（円）",type:"number",step:"1",required:true},{name:"plannedQuantity",label:"予定数量",type:"number",step:"1",required:true},{name:"actualUnitPrice",label:"実際単価（円）",type:"number",step:"1"},{name:"actualQuantity",label:"実際数量",type:"number",step:"1"}],"商品を追加","sf")+'<div class="tablewrap section"><table><thead><tr><th>商品</th><th>予定額</th><th>実額</th><th>状態</th></tr></thead><tbody>'+s.map(([id,v])=>'<tr><td>'+esc(v.name)+'<br><a href="'+esc(v.url)+'" target="_blank" rel="noopener noreferrer">商品URL</a></td><td>¥'+((+v.plannedUnitPrice||0)*(+v.plannedQuantity||0)).toLocaleString("ja-JP")+'</td><td>¥'+((+v.actualUnitPrice||0)*(+v.actualQuantity||0)).toLocaleString("ja-JP")+'</td><td>'+esc(v.status||"未購入")+' <button data-buy="'+esc(id)+'">購入済み</button></td></tr>').join("")+'</tbody></table></div>'; $("sf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),url=String(f.get("url")),u=new URL(url),unit=Number(f.get("plannedUnitPrice")),qty=Number(f.get("plannedQuantity")),au=Number(f.get("actualUnitPrice")||0),aq=Number(f.get("actualQuantity")||0);if(u.protocol!=="https:"||![unit,qty,au,aq].every(Number.isSafeInteger)||unit<0||qty<1||au<0||aq<0)return toast("URL・金額・数量を確認してください");try{const id=db.ref("shopping_items").push().key;await write("shopping_items/"+id,{name:String(f.get("name")).trim(),url,category:String(f.get("category")).trim(),plannedUnitPrice:unit,plannedQuantity:qty,actualUnitPrice:au,actualQuantity:aq,status:"未購入",createdAt:new Date().toISOString()});renderAdmin()}catch(x){toast(friendly(x))}};p.querySelectorAll("[data-buy]").forEach(btn=>btn.onclick=async()=>{const v=items[btn.dataset.buy];try{await write("shopping_items/"+btn.dataset.buy+"/status","購入済み");const amount=(+v.actualUnitPrice||0)*(+v.actualQuantity||0);if(amount>0)await write("ledger/shopping_"+btn.dataset.buy,{date:new Date().toISOString().slice(0,10),description:v.name,category:v.category,amount,relatedItemId:btn.dataset.buy,createdAt:new Date().toISOString()});renderAdmin()}catch(x){toast(friendly(x))}})}
else if(tab==="budget"){p.innerHTML='<h2>予算・会計</h2>'+form([{name:"category",label:"予算カテゴリ",required:true},{name:"budget",label:"予算（円）",type:"number",step:"1",required:true}],"予算を登録","bf")+form([{name:"date",label:"日付",type:"date",required:true},{name:"description",label:"内容",required:true},{name:"category",label:"カテゴリ",required:true},{name:"amount",label:"実際の金額（円）",type:"number",step:"1",required:true}],"支出を登録","lf")+'<div class="grid3 section"><div class="stat"><span>予算合計</span><strong>¥'+b.reduce((n,x)=>n+(+x[1].amount||0),0).toLocaleString("ja-JP")+'</strong></div><div class="stat"><span>実支出</span><strong>¥'+l.reduce((n,x)=>n+(+x[1].amount||0),0).toLocaleString("ja-JP")+'</strong></div><div class="stat"><span>残り</span><strong>¥'+(b.reduce((n,x)=>n+(+x[1].amount||0),0)-l.reduce((n,x)=>n+(+x[1].amount||0),0)).toLocaleString("ja-JP")+'</strong></div></div><div class="tablewrap section"><table><thead><tr><th>日付</th><th>内容</th><th>カテゴリ</th><th>金額</th></tr></thead><tbody>'+l.map(([id,v])=>'<tr><td>'+esc(v.date)+'</td><td>'+esc(v.description)+'</td><td>'+esc(v.category)+'</td><td>¥'+(+v.amount||0).toLocaleString("ja-JP")+'</td></tr>').join("")+'</tbody></table></div><button id="csv" class="secondary">会計CSV</button>'; $("bf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),n=Number(f.get("budget"));if(!Number.isSafeInteger(n)||n<0)return toast("金額を確認してください");try{const id=db.ref("budgets").push().key;await write("budgets/"+id,{category:String(f.get("category")).trim(),amount:n});renderAdmin()}catch(x){toast(friendly(x))}};$("lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),n=Number(f.get("amount"));if(!Number.isSafeInteger(n)||n<0)return toast("金額を確認してください");try{const id=db.ref("ledger").push().key;await write("ledger/"+id,{date:String(f.get("date")),description:String(f.get("description")).trim(),category:String(f.get("category")).trim(),amount:n,createdAt:new Date().toISOString()});renderAdmin()}catch(x){toast(friendly(x))}};$("csv").onclick=()=>{const csv="\uFEFF"+[["日付","内容","カテゴリ","金額"],...l.map(([,v])=>[v.date,v.description,v.category,v.amount])].map(row=>row.map(v=>{let s=String(v??"");if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(",")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="kaikei.csv";a.click();URL.revokeObjectURL(url)}}
else if(tab==="tasks"){p.innerHTML='<h2>タスク</h2>'+form([{name:"title",label:"タスク名",required:true},{name:"assignee",label:"担当者"},{name:"deadline",label:"期限",type:"date"},{name:"priority",label:"優先度",required:true},{name:"detail",label:"詳細"}],"タスクを追加","tf")+'<div class="tablewrap section"><table><thead><tr><th>タスク</th><th>担当</th><th>期限</th><th>優先度</th><th>状態</th><th></th></tr></thead><tbody>'+t.map(([id,v])=>'<tr><td>'+esc(v.title)+'<br>'+esc(v.detail)+'</td><td>'+esc(v.assignee)+'</td><td>'+esc(v.deadline)+'</td><td>'+esc(v.priority)+'</td><td>'+esc(v.status||"未着手")+'</td><td><button data-done="'+esc(id)+'">完了</button></td></tr>').join("")+'</tbody></table></div>'; $("tf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const id=db.ref("tasks").push().key;await write("tasks/"+id,{title:String(f.get("title")).trim(),assignee:String(f.get("assignee")||"").trim(),deadline:String(f.get("deadline")||""),priority:String(f.get("priority")||"中"),detail:String(f.get("detail")||"").trim(),status:"未着手",createdAt:new Date().toISOString()});renderAdmin()}catch(x){toast(friendly(x))}};p.querySelectorAll("[data-done]").forEach(btn=>btn.onclick=async()=>{try{await write("tasks/"+btn.dataset.done+"/status","完了");renderAdmin()}catch(x){toast(friendly(x))}})}
