<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf7ff">
  <title>桐榮祭2026 管理画面へ移動</title>
  <style>
    :root{color-scheme:light;--ink:#244054;--blue:#8bd2f4;--line:#dcebf3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f8fcff,#e7f4ff);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    main{width:min(100%,440px);padding:28px;background:#fff;border:1px solid var(--line);border-radius:20px;text-align:center;box-shadow:0 12px 36px #2e73900c}
    h1{font-size:1.2rem;margin:0 0 10px}
    p{line-height:1.7;color:#718797}
    a{display:inline-block;padding:11px 18px;border-radius:12px;background:var(--blue);color:#173f55;text-decoration:none;font-weight:700}
  </style>
  <script>window.location.replace("./index.html");</script>
</head>
<body>
  <main>
    <h1>桐榮祭2026 打ち上げ管理</h1>
    <p>管理画面はトップページ内にあります。トップページへ移動しています。</p>
    <a href="./index.html">トップページを開く</a>
  </main>
</body>
</html>
